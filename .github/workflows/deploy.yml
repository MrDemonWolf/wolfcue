name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_https:
        description: Require a valid certificate before deploying
        type: boolean
        default: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install WebKit and OS packages
        run: bunx playwright install --with-deps webkit
      - name: Verify and build
        run: bun run ci
        env:
          BASE_PATH: /
          SITE_ORIGIN: https://wolfcue.mrdemonwolf.dev
          COMMIT_SHA: ${{ github.sha }}
      - name: Check the artifact
        run: |
          set -euo pipefail
          test -s apps/web/dist/index.html
          test -s apps/web/dist/404.html
          test -s apps/web/dist/docs/index.html
          if find apps/web/dist -type l | grep -q .; then
            echo "::error::The Pages artifact contains symlinks."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the WolfCue domain cutover
        env:
          PAGES_API_TOKEN: ${{ github.token }}
          REQUIRE_HTTPS: ${{ inputs.require_https }}
          SITE_HOST: wolfcue.mrdemonwolf.dev
        run: |
          set -euo pipefail
          pages="$(curl -fsS -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${PAGES_API_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cname="$(jq -r '.cname // ""' <<<"$pages" | tr '[:upper:]' '[:lower:]')"
          if [[ "$cname" != "$SITE_HOST" ]]; then
            echo "::error::Refusing root deployment: Pages cname is '${cname:-unset}'."
            exit 1
          fi
          dns_target="$(dig +short CNAME "$SITE_HOST" | tr '[:upper:]' '[:lower:]' | sed 's/\.$//')"
          if [[ "$dns_target" != "mrdemonwolf.github.io" ]]; then
            echo "::error::Refusing root deployment: DNS CNAME is '${dns_target:-unset}'."
            exit 1
          fi
          # The first site can return 404 with a valid certificate; do not use -f.
          if [[ "$REQUIRE_HTTPS" != "false" ]]; then
            curl -sSI --max-time 10 -o /dev/null "https://${SITE_HOST}/"
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
